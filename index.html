<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trip Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#172033}button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{max-width:1000px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 2px 18px rgba(20,40,80,.08)}header{padding:20px 24px;border-bottom:1px solid #dbe2ea;display:flex;justify-content:space-between;align-items:center;gap:14px}h1{font-size:23px;margin:0}.sub{font-size:12px;color:#667085;margin-top:4px}
nav{display:flex;gap:8px;padding:16px 20px 4px}.nav{border:0;border-radius:9px;padding:10px 18px;background:#e8eef8;color:#31507e;font-weight:700}.nav.active{background:#2563eb;color:#fff}.nav-search{display:flex;align-items:center;gap:7px;flex:1;min-width:220px;max-width:520px;background:#e8eef8;border:1px solid #dbe2ea;border-radius:9px;padding:0 11px;color:#31507e}.nav-search-icon{font-size:20px;line-height:1}.nav-search input{border:0!important;outline:0;background:transparent!important;width:100%;padding:10px 4px!important;color:#172033}
.screen{display:none;padding:24px 26px 45px}.screen.active{display:block}.actions{display:flex;flex-direction:column;align-items:center;gap:12px;margin:28px 0}.action{width:min(360px,100%);padding:14px;border:1px solid #aebdd1;border-radius:10px;background:#fff;color:#29476f;font-weight:800}.action.primary{border-color:#6fb486;color:#146b32}
.panel{border:1px solid #dbe2ea;border-radius:12px;background:#fff;margin:10px 0;overflow:hidden}.head{padding:14px 16px;background:#eaf2ff;display:flex;justify-content:space-between;align-items:center;gap:10px}.head h3{font-size:15px;margin:0}.head p{font-size:12px;color:#667085;margin:4px 0 0}.body{padding:16px}.hidden{display:none!important}
.notes{margin-top:16px;padding:13px;background:#eaf2ff;border-radius:12px}.notes-row{display:flex;justify-content:space-between;font-size:12px;color:#31507e;margin-bottom:7px}.notes-row span{color:#15803d;font-size:11px}textarea{width:100%;min-height:120px;border:1px solid #dbe2ea;border-radius:9px;padding:10px;resize:vertical}
.managed{display:block;cursor:pointer;pointer-events:auto;margin:80px 0 0;border:0;background:transparent;color:#a2a8b3;font-size:11px;font-style:italic}.admin-actions{display:flex;gap:18px;margin-top:90px}.admin-actions button{flex:1}
.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.heading h2{font-size:21px;margin:0}.heading p{font-size:12px;color:#667085;margin:4px 0}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.blue{background:#2563eb;color:#fff}.soft{background:#e8eef8;color:#31507e}.danger{background:#fee2e2;color:#991b1b}
input,select{padding:10px;border:1px solid #dbe2ea;border-radius:8px;background:#fff;width:100%}.search{margin-bottom:15px}.stack{display:flex;flex-direction:column;gap:10px}.big{width:100%;padding:21px;border:1px solid #aebdd1;border-radius:12px;background:#fff;color:#29476f;font-weight:800}.stack.gap{gap:14px}
.trip-meta{font-size:12px;color:#667085}.route{display:flex;flex-direction:column}.route div{padding:7px 0;border-bottom:1px solid #edf0f4}.member{padding:7px 0;border-bottom:1px solid #edf0f4}.row-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.small{padding:7px 10px;border:1px solid #dbe2ea;background:#fff;border-radius:7px;font-size:12px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700}.checks{border:1px solid #dbe2ea;border-radius:9px;padding:9px}.check{display:flex;gap:8px;align-items:center;padding:4px 0}.check input{width:auto}.counter{font-size:11px;color:#667085;margin-top:5px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-card{width:min(700px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:15px;padding:20px}.modal-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{border:0;background:transparent;font-size:25px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stats.three{grid-template-columns:repeat(3,1fr)}.stat{padding:13px;border:1px solid #dbe2ea;border-radius:10px}.stat small{color:#667085;display:block;font-size:11px}.stat b{font-size:19px}.report{margin-top:18px}.report h3{font-size:16px;margin:0 0 9px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{border:1px solid #dbe2ea;padding:7px;text-align:left}.table th{background:#edf3ff}.expense{border:1px solid #dbe2ea;border-radius:9px;padding:11px;margin:7px 0}.expense-top{display:flex;justify-content:space-between;gap:8px}.muted{color:#667085;font-size:12px}.ok{color:#15803d}.warn{color:#b45309}
#pdfPrint{display:none}.pie{width:190px;height:190px;display:block;margin:12px auto}.report-matrix th,.report-matrix td{min-width:80px}.category-table .pie-cell{vertical-align:middle;text-align:center;width:230px}.report-pie{width:190px;height:190px}.pdf-settlement{padding:5px 0;line-height:1.6}
@media(max-width:650px){header{align-items:flex-start;flex-direction:column}.screen{padding:20px 15px 35px}.formgrid,.stats{grid-template-columns:1fr}.admin-actions{margin-top:50px}.admin-actions button{flex:1}.heading{align-items:flex-start;flex-direction:column}.nav-search{min-width:0;max-width:none}}
@media print{
 @page{margin:10mm}
 body{background:#fff!important;margin:0!important}
 .app{display:none!important}
 #pdfPrint{display:block!important;margin:0!important;padding:0!important;font-size:10px}
 #pdfPrint .pdf-page{display:block!important;width:100%!important;margin:0!important;padding:0!important;min-height:0!important;page-break-after:auto!important;break-after:auto!important}
 #pdfPrint .pdf-page-2{page-break-before:always!important;break-before:page!important}
 .pdf-title{font-size:18px;margin:0 0 8px}
 .pdf-block{margin:7px 0}
 .pdf-block h3{font-size:12px;border-bottom:1px solid #999;padding-bottom:3px;margin:0 0 5px}
 .pdf-table{width:100%;border-collapse:collapse;font-size:9px}
 .pdf-table th,.pdf-table td{border:1px solid #aaa;padding:4px}
 .pdf-table th{background:#eee}
 .pdf-matrix th,.pdf-matrix td{min-width:0}
 .pdf-table .pie-cell{width:230px;vertical-align:middle;text-align:center}
 .pdf-table .report-pie{width:185px;height:185px}
 .pdf-settlement{line-height:1.45}
}
.settle-help{margin-top:-4px;margin-bottom:4px;line-height:1.45} .heading .back-group{display:flex;gap:8px;flex-wrap:wrap}</style>
</head>
<body>
<div class="app">
<header><div><h1>Trip Manager</h1><div class="sub">Simple, complete trip expense tracking</div></div></header>
<nav><button class="nav active" data-screen="home">HOME</button><button class="nav" data-screen="trips">TRIPS</button><div class="nav-search"><span class="nav-search-icon">⌕</span><input id="navUniversalSearch" type="search" placeholder="Search..." autocomplete="off"></div></nav>

<section id="home" class="screen active">
<div class="actions"><button id="addExpense" class="action primary" type="button" onclick="expenseModal()">＋ ADD EXPENSE</button><button class="action" data-screen="reports">▤ VIEW REPORTS</button></div>
<div id="homeTrip"></div>
<div id="homeNotes" class="notes hidden"><div class="notes-row"><b>NOTES</b><span id="noteStatus">Saved</span></div><textarea id="notesBox"></textarea></div>
<button id="adminTrigger" class="managed">MANAGED AND DESIGNED BY</button>
<div id="adminActions" class="admin-actions hidden"><button class="btn soft" data-screen="manage">MANAGE</button><button class="btn soft" data-screen="accounts">ACCOUNTS</button></div>
</section>

<section id="trips" class="screen"><div class="heading"><div><h2>Trips</h2><p>Current, pinned and previous trips</p></div><button class="btn soft" onclick="goBack()">BACK</button><button class="btn blue" id="addTrip" type="button" onclick="tripModal()">＋ ADD TRIP</button></div><div class="search"><input id="tripSearch" placeholder="Search trips..."></div><div id="tripList"></div></section>

<section id="search" class="screen"><div class="heading"><div><h2>Universal Search</h2><p>Search trips, members, expenses and notes</p><button class="btn soft" onclick="goBack()">BACK</button></div></div><input id="globalSearch" placeholder="Search anything..."><div id="results" class="stack" style="margin-top:15px"></div></section>

<section id="reports" class="screen"><div class="heading"><div><h2>Trip Summary</h2><p id="reportTitle"></p></div><button class="btn soft" onclick="goBack()">BACK</button></div><div id="reportSummary"></div><div class="row-actions page-links"><button class="btn" data-screen="expensesPage">EXPENSES</button><button class="btn" data-screen="analysisPage">EXPENSE ANALYSIS</button></div></section>
<section id="expensesPage" class="screen"><div class="heading"><div><h2>Expenses</h2><p id="expensePageTitle"></p></div><button class="btn soft" data-screen="reports">BACK</button></div><div id="expensePageContent"></div></section>
<section id="analysisPage" class="screen"><div class="heading"><div><h2>Expense Analysis</h2><p id="analysisPageTitle"></p></div><button class="btn soft" data-screen="reports">BACK</button></div><div id="analysisPageContent"></div></section>

<section id="manage" class="screen admin"><div class="heading"><h2>Manage</h2><button class="btn soft" onclick="goBack()">BACK</button></div><div class="stack gap"><button class="big" data-screen="members">MEMBERS</button><button class="big" id="manageSettle">SETTLE ACCOUNTS</button><button class="big" data-screen="settled">SETTLED TRIPS</button></div></section>

<section id="accounts" class="screen admin"><div class="heading"><h2>Accounts</h2><button class="btn soft" onclick="goBack()">BACK</button></div><div class="stack gap"><button class="big" id="genReports">GENERATE REPORTS</button><button class="big" id="backup">BACKUP DATA</button><button class="big" id="restore">RESTORE DATA</button><input id="restoreFile" type="file" accept=".json" hidden></div></section>

<section id="members" class="screen admin"><div class="heading"><h2>Members</h2><button class="btn blue" id="addMember">＋ ADD MEMBER</button></div><button class="btn soft" onclick="goBack()">BACK</button><div class="search"><input id="memberSearch" placeholder="Search members..."></div><div id="membersList" class="stack"></div></section>

<section id="settled" class="screen admin"><div class="heading"><h2>Settled Trips</h2></div><button class="btn soft" onclick="goBack()">BACK</button><div id="settledList" class="stack"></div></section>
</div>

<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-title"><h3 id="modalTitle"></h3><button class="close" id="closeModal">×</button></div><div id="modalBody"></div></div></div>
<div id="pdfPrint"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
"use strict";
const DB="tripManagerDataV3",OLDM="tripExpenseMembers",OLDT="tripExpenseTrips";
let S=load(),screen="home",admin=false,tripId=null,clicks=0;

function base(){return{version:3,members:[],trips:[],expenses:[],categories:["Food","Hotel / Stay","Travel / Fuel","Tickets / Toll","Shopping","Miscellaneous"],settlements:[]}}
function id(p){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7)}
function esc(v=""){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function money(n){return "₹"+Math.round(Number(n)||0).toLocaleString("en-IN")}
function load(){
 try{let x=localStorage.getItem(DB);if(x)return normalize(JSON.parse(x));
 let s=base(),ms=JSON.parse(localStorage.getItem(OLDM)||"[]"),ts=JSON.parse(localStorage.getItem(OLDT)||"[]");
 s.members=ms.map(m=>({...m,id:m.id||m.code,status:m.status||"Active"}));
 s.trips=ts.map((t,i)=>({...t,id:t.id||t.code||id("T"),code:t.code||"T"+String(i+1).padStart(3,"0"),tripDate:t.tripDate||t.startDate||"",startDate:t.startDate||"",endDate:t.endDate||"",notes:t.notes||"",source:t.source||"",destinations:t.destinations||((t.destination||"")?[t.destination]:[]),memberIds:t.memberIds||[],transportMode:t.transportMode||"",transportDetails:t.transportDetails||"",vehicleName:t.vehicleName||"",fuelRate:t.fuelRate||"",odometerStart:t.odometerStart||"",odometerEnd:t.odometerEnd||"",distanceTravelled:t.distanceTravelled||"",status:t.status||"ACTIVE",createdAt:t.createdAt||new Date().toISOString(),lastUpdated:new Date().toISOString(),pinned:false,firstSettledAt:t.firstSettledAt||null}));
 return s}catch(e){return base()}
}
function normalize(x){let s={...base(),...x};s.members=s.members||[];s.trips=s.trips||[];s.expenses=s.expenses||[];s.settlements=s.settlements||[];s.trips.forEach(t=>{t.memberIds=t.memberIds||[];t.destinations=t.destinations||[];t.status=t.status||"ACTIVE";t.notes=t.notes||""});return s}
function save(){localStorage.setItem(DB,JSON.stringify(S))}
function current(){let t=S.trips.find(t=>t.id===tripId);if(t)return t;t=S.trips.find(t=>t.status==="ACTIVE");if(t){tripId=t.id;return t}t=S.trips[0]||null;if(t)tripId=t.id;return t}
function mems(t){return(t?.memberIds||[]).map(x=>S.members.find(m=>m.id===x)).filter(Boolean)}
function exps(t){return S.expenses.filter(e=>e.tripId===t.id)}
function total(t){return exps(t).reduce((a,e)=>a+Number(e.amount||0),0)}
let navHistory=[];
function show(idn,fromBack=false){
 if(["manage","accounts","members","settled"].includes(idn)&&!admin)return;
 if(!fromBack&&screen!==idn)navHistory.push(screen);
 screen=idn;
 document.querySelectorAll(".screen").forEach(x=>x.classList.toggle("active",x.id===idn));
 document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.screen===idn));
 render();
}
function goBack(){
 if(navHistory.length){let previous=navHistory.pop();show(previous,true);}
 else if(screen!=="home")show("home",true);
}
document.addEventListener("click",e=>{let b=e.target.closest("[data-screen]");if(b)show(b.dataset.screen)});
function render(){home();trips();members();settled();reports();expensePage();analysisPage();search();let aa=document.getElementById("adminActions"),at=document.getElementById("adminTrigger");if(admin){aa.classList.remove("hidden");aa.style.display="flex";at.style.display="none"}else{aa.classList.add("hidden");aa.style.display="";at.style.display=""}}
function home(){
 let t=current(),box=document.getElementById("homeTrip"),np=document.getElementById("homeNotes"),ta=document.getElementById("notesBox"),ab=document.getElementById("addExpense");
 if(!t){box.innerHTML='<div class="panel"><div class="body"><button class="btn blue" onclick="tripModal()">＋ ADD TRIP</button></div></div>';np.classList.add("hidden");ab.disabled=true;return}
 ab.disabled=t.status!=="ACTIVE";ab.title=t.status==="SETTLED"?"This trip is settled. Re-activate it from Manage to add expenses.":"";np.classList.remove("hidden");ta.value=t.notes||"";
 box.innerHTML='<div class="panel"><div class="head" onclick="toggleHome()"><div><h3>CURRENT TRIP : '+esc(t.tripDate||t.startDate||"")+" - "+esc(t.source||"HOME")+" "+(t.destinations.length?"TO "+t.destinations.map(esc).join(" TO "):"")+'</h3><p>'+t.status+'</p></div><b>⌄</b></div><div id="homeBody" class="body hidden"><h4>1. DATE</h4><div>'+esc(t.startDate)+' → '+esc(t.endDate)+'</div><h4>2. DESTINATIONS TO REACH</h4><div class="route">'+[t.source,...t.destinations].filter(Boolean).map((x,i)=>'<div>📍 '+esc(x)+(i===0?" (Start)":"")+'</div>').join("")+'</div><h4>3. MEMBERS IN THIS TRIP</h4>'+mems(t).map(m=>'<div class="member">👤 '+esc(m.name)+'</div>').join("")+'<h4>4. OTHER DETAILS</h4><div class="muted">Trip Name: '+esc(t.name)+'<br>Transport Mode: '+esc(t.transportMode||"—")+'<br>Transport Details: '+esc(t.transportDetails||"—")+'<br>Vehicle Name: '+esc(t.vehicleName||"—")+'<br>Fuel Rate: '+esc(t.fuelRate||"—")+'<br>Distance: '+esc(t.distanceTravelled||"—")+'<br>Last Updated: '+new Date(t.lastUpdated).toLocaleString()+'</div></div></div>';
 ta.oninput=()=>{t.notes=ta.value;t.lastUpdated=new Date().toISOString();document.getElementById("noteStatus").textContent="Saving…";save();clearTimeout(window.nt);window.nt=setTimeout(()=>document.getElementById("noteStatus").textContent="Saved",300)}
}
function toggleHome(){document.getElementById("homeBody")?.classList.toggle("hidden")}
function tripCard(t,adminMode=false){return'<div class="panel"><div class="head" onclick="tripId=\''+t.id+'\';this.nextElementSibling.classList.toggle(\'hidden\')"><div><h3>'+esc(t.name)+'</h3><p>'+esc(t.startDate||t.tripDate||"")+' → '+esc(t.endDate||"")+' · '+t.status+(t.pinned?" · 📌":"")+'</p></div><b>⌄</b></div><div class="body hidden"><div><b>Spots:</b> '+esc([t.source,...t.destinations].filter(Boolean).join(" → ")||"—")+'</div><div class="muted" style="margin-top:7px">Members: '+mems(t).map(m=>esc(m.name)).join(", ")+'</div><div class="row-actions"><button class="small" onclick="tripId=\''+t.id+'\';show(\'reports\')">View Report</button><button class="small" onclick="togglePin(\''+t.id+'\')">'+(t.pinned?"Unpin":"Pin")+'</button>'+(adminMode?'<button class="small" onclick="tripModal(\''+t.id+'\')">Edit</button><button class="small" onclick="reactivate(\''+t.id+'\')">Re-activate</button><button class="small danger" onclick="deleteTrip(\''+t.id+'\')">Delete</button>':"")+'</div></div></div>'}
function trips(){let q=(document.getElementById("tripSearch")?.value||"").toLowerCase(),ct=current(),all=S.trips.filter(t=>JSON.stringify(t).toLowerCase().includes(q)),cur=ct&&all.some(t=>t.id===ct.id)?all.filter(t=>t.id===ct.id):[],pin=all.filter(t=>t.id!==(ct?.id||"")&&t.pinned),prev=all.filter(t=>t.id!==(ct?.id||"")&&!t.pinned);document.getElementById("tripList").innerHTML='<h3>Current Trip</h3>'+(cur.map(t=>tripCard(t,admin)).join("")||'<div class="muted">No current trip.</div>')+'<h3 style="margin-top:22px">Pinned Trips</h3>'+(pin.map(t=>tripCard(t,admin)).join("")||'<div class="muted">No pinned trips.</div>')+'<h3 style="margin-top:22px">Previous Trips</h3>'+(prev.map(t=>tripCard(t,admin)).join("")||'<div class="muted">No previous trips.</div>')}
function members(){let q=(document.getElementById("memberSearch")?.value||"").toLowerCase(),a=[...S.members].filter(m=>JSON.stringify(m).toLowerCase().includes(q)).sort((x,y)=>(x.status==="Active"?0:1)-(y.status==="Active"?0:1));document.getElementById("membersList").innerHTML=a.map(m=>'<div class="panel"><div class="body"><div style="display:flex;justify-content:space-between"><div><b class="code">'+esc(m.code||"")+'</b><h3 style="margin:5px 0">'+esc(m.name)+'</h3><div class="muted">'+esc(m.mobile||"")+' '+esc(m.address||"")+'</div></div><b class="'+(m.status==="Inactive"?"warn":"ok")+'">'+m.status+'</b></div><div class="row-actions"><button class="small" onclick="memberModal(\''+m.id+'\')">Edit</button><button class="small" onclick="toggleMember(\''+m.id+'\')">'+(m.status==="Active"?"Make Inactive":"Activate")+'</button></div></div></div>').join("")||'<div class="muted">No members.</div>'}
function settled(){document.getElementById("settledList").innerHTML=S.trips.filter(t=>t.status==="SETTLED").map(t=>tripCard(t,true)).join("")||'<div class="muted">No settled trips.</div>'}
function search(){let q=(document.getElementById("globalSearch")?.value||"").trim().toLowerCase(),o=[];if(!q){document.getElementById("results").innerHTML="";return}S.trips.forEach(t=>{if(JSON.stringify(t).toLowerCase().includes(q))o.push('<div class="panel"><div class="body"><b>TRIP</b><h3>'+esc(t.name)+'</h3><button class="small" onclick="tripId=\''+t.id+'\';show(\'reports\')">Open</button></div></div>')});S.members.forEach(m=>{if(JSON.stringify(m).toLowerCase().includes(q))o.push('<div class="panel"><div class="body"><b>MEMBER</b><h3>'+esc(m.name)+'</h3></div></div>')});S.expenses.forEach(e=>{if(JSON.stringify(e).toLowerCase().includes(q))o.push('<div class="panel"><div class="body"><b>EXPENSE</b><div>'+esc(e.description||e.category)+' · '+money(e.amount)+'</div></div></div>')});document.getElementById("results").innerHTML=o.join("")||'<div class="muted">No results.</div>'}
function reportData(t){let es=exps(t),ms=mems(t),cat={};es.forEach(e=>cat[e.category]=(cat[e.category]||0)+Number(e.amount));let common=0,individual=0;es.forEach(e=>{if((e.sharedBy||[]).length===ms.length)common+=Number(e.amount);else individual+=Number(e.amount)});return{es,ms,cat,common,individual,total:common+individual}}
function reportGroups(t){
 let d=reportData(t), members=d.ms, expenses=d.es;
 let common=expenses.filter(e=>(e.sharedBy||[]).length===members.length);
 let individual=expenses.filter(e=>(e.sharedBy||[]).length!==members.length);
 return {d,members,expenses,common,individual};
}
function settlementLines(t,which="all"){
 let g=reportGroups(t),es=which==="common"?g.common:which==="individual"?g.individual:g.expenses;
 let bal={};g.members.forEach(m=>bal[m.id]=0);
 es.forEach(e=>{
   let sh=(e.sharedBy||[]).filter(id=>bal[id]!==undefined);
   if(!sh.length)return;
   let amt=Number(e.amount)||0,share=amt/sh.length;
   sh.forEach(id=>bal[id]-=share);
   if(bal[e.paidBy]!==undefined)bal[e.paidBy]+=amt;
 });
 let debt=g.members.filter(m=>bal[m.id]<-0.005).map(m=>({m,a:-bal[m.id]}));
 let cred=g.members.filter(m=>bal[m.id]>0.005).map(m=>({m,a:bal[m.id]}));
 let out=[],i=0,j=0;
 while(i<debt.length&&j<cred.length){
   let x=Math.min(debt[i].a,cred[j].a);
   if(x>0.005)out.push({from:debt[i].m,to:cred[j].m,amount:x});
   debt[i].a-=x;cred[j].a-=x;
   if(debt[i].a<0.005)i++;
   if(cred[j].a<0.005)j++;
 }
 return out;
}
function settlementHTML(t,which="all"){
 let a=settlementLines(t,which);
 return a.length?a.map(x=>'<div>'+esc(x.from.name)+' pays '+esc(x.to.name)+' = <b>'+money(x.amount)+'</b></div>').join(""):'<div class="muted">No settlement required.</div>';
}
function memberHeaders(ms){return ms.map(m=>'<th>'+esc(m.name)+'</th>').join("")}
function commonMatrixHTML(t,cls="table"){
 let g=reportGroups(t),ms=g.members;
 let rows=g.common.map(e=>{
